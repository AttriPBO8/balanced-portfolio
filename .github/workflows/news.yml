name: news
# Daily press-release and headline collection (§8.3). Runs even when the daily job is off, so the
# forward-only history for T3-6..T3-9 keeps building. Google News: <= 1 request per ticker per day.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-nlp.txt
      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - run: python -m ingest.news
      - name: Score new headlines with FinBERT (T3-8)
        continue-on-error: true
        run: python -m ingest.finbert
      - run: |
          git config user.name "callout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pipeline.gitsync "news $(date -u +%F)" artifacts/news state/news_state.json
