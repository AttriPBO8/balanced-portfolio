name: news
# Daily press-release and headline collection (§8.3). Runs even when the daily job is off, so the
# forward-only history for T3-6..T3-9 keeps building. Google News: <= 1 request per ticker per day.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ingest.news
      - run: |
          git config user.name "callout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/news state/news_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "news $(date -u +%F)"
          git pull --rebase
          git push
