name: backtest
# Historical replay with the production code path, naive baseline, DSR, PBO and ablation.
# Takes roughly 20-40 minutes on a standard runner. Runs monthly, or on demand.
on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First decision date (YYYY-MM-DD); empty = earliest with enough history"
        required: false
      every_weeks:
        description: "Decision every N weeks (1 = same as production)"
        required: false
        default: "1"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Run backtest
        env:
          START: ${{ github.event.inputs.start }}
          EVERY: ${{ github.event.inputs.every_weeks }}
        run: |
          args=""
          if [ -n "$START" ]; then args="$args --start $START"; fi
          if [ -n "$EVERY" ]; then args="$args --every-weeks $EVERY"; fi
          python -m backtest.replay $args
      - name: Commit backtest results
        run: |
          git config user.name "callout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/backtest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backtest $(date -u +%F) [run ${{ github.run_id }}]"
          git pull --rebase
          git push
      - run: python site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Backtest failed" --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  deploy:
    needs: backtest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
