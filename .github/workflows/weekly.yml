name: weekly
# Saturday ~8:17 ET (13:17 UTC) with a Sunday retry (no-op if Saturday published). Odd minute on purpose:
# GitHub delays top-of-hour schedules, sometimes by hours. Cron is UTC; the job
# works out the Toronto decision date itself, so DST and late starts don't matter (§5.2).
on:
  schedule:
    - cron: "17 13 * * 6"
    - cron: "17 13 * * 0"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Run date: 'saturday' = this week's scheduled set (Friday's close); 'today' = dated today, using the latest close"
        type: choice
        options: [today, saturday]
        default: today
      force_reissue:
        description: "Reason for re-issuing a set already published for that date (leave empty for a normal run)"
        required: false
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Collect news (forward history)
        continue-on-error: true
        run: python -m ingest.news --no-google
      - name: US screen (step 1, refreshed monthly)
        continue-on-error: true
        run: python -m pipeline.us_screen
      - name: Weekly run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORCE_REISSUE: ${{ github.event.inputs.force_reissue }}
          AS_OF: ${{ github.event.inputs.as_of }}
        run: |
          args=()
          if [ "$AS_OF" = "today" ]; then args+=(--as-of-today); fi
          if [ -n "$FORCE_REISSUE" ]; then args+=(--force-reissue "$FORCE_REISSUE"); fi
          python -m pipeline.run_weekly "${args[@]}"
      - name: Commit artifacts (the audit trail)
        run: |
          git config user.name "callout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pipeline.gitsync "weekly callouts $(date -u +%F) [run ${{ github.run_id }}]" artifacts state data/universe
      - name: Build dashboard
        if: always()
        run: python site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - name: Open issues for alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .alerts/alerts.json ]; then
            python - <<'PY'
          import json, subprocess
          for a in json.load(open(".alerts/alerts.json")):
              subprocess.run(["gh", "issue", "create", "--title", a["title"], "--body", a["body"]], check=False)
          PY
          fi
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Weekly pipeline failed" --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Nothing was committed and run_state.json is unchanged; the Sunday retry or next week resumes."
  deploy:
    needs: weekly
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
